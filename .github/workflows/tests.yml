# Runs the offline test suite on every PR and every push to main. No secrets, no network beyond pip.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # The exact pinned set the VM gets (T-4), then pytest on its own.
      - run: "python -m pip install --require-hashes --only-binary :all: -r requirements.txt"
      - run: python -m pip install pytest==9.2.0
      - run: python -m pytest -q
  # 0.40.1: the setup scripts run on clients' Windows PowerShell 5.1, so CI parses every .ps1 with it.
  ps-parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1 -Path scripts) {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
            foreach ($x in $e) { Write-Host "$($f.FullName):$($x.Extent.StartLineNumber): $($x.Message)"; $bad++ }
          }
          Write-Host "PowerShell $($PSVersionTable.PSVersion): $bad parse errors"
          if ($bad) { exit 1 }
