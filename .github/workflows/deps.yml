# T-4: guards for the pinned libraries. Runs on every PR, every push to main, and weekly (new CVEs appear
# even when nobody touches the code). No secrets; network only to PyPI.
name: deps
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Every library pinned to one version with hashes; nothing younger than 7 days
        run: python scripts/check_deps.py --online
      - name: The VM (Windows, Python 3.13) can get every file, hashes verified, no building from source
        run: >
          python -m pip download --disable-pip-version-check --no-deps --require-hashes --only-binary :all:
          --platform win_amd64 --python-version 3.13 --implementation cp
          -r requirements.txt -d "$RUNNER_TEMP/win"
      - name: Every native module in those Windows wheels loads on the VM's Python 3.13
        run: python scripts/check_deps.py --wheels "$RUNNER_TEMP/win"
      - name: No known vulnerabilities (CVE) in the pinned versions
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --strict --require-hashes -r requirements.txt
